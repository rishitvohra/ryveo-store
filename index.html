
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYVEO | Streetwear</title>
<meta name="description" content="Shop oversized tees, graphic T-shirts and streetwear from Ryveo.">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:22px 6%;display:flex;
justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;letter-spacing:4px}
header a{color:white;text-decoration:none}
.hero{background:#111;color:white;padding:65px 7%;text-align:center}
.hero h1{font-size:clamp(38px,8vw,76px);margin:0 0 15px}
.hero p{color:#ccc}
.hero a{display:inline-block;background:white;color:#111;padding:13px 24px;
text-decoration:none;font-weight:bold;margin-top:15px}
main{padding:40px 5%}
.section-title{font-size:30px;margin-bottom:25px}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.product{border:1px solid #eee;padding:12px;min-width:0}
.product img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f4f4f4}
.product h3{margin:12px 0 6px}
.price{font-size:19px;font-weight:bold;margin:10px 0}
.product p{color:#666;font-size:13px}
select,input,button{width:100%;padding:12px;margin:5px 0;
border:1px solid #ddd;background:white;font-size:14px}
button{cursor:pointer;font-weight:bold}
.order{background:#111;color:white;border:0}
footer{background:#111;color:#ddd;text-align:center;padding:30px 15px}
footer a{color:white}
@media(max-width:700px){
 .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 main{padding:28px 12px}
 .product{padding:8px}
 .product h3{font-size:15px}
 .hero{padding:48px 15px}
}
</style>
</head>
<body>
<header>
  <div class="logo">RYVEO.</div>
  <a href="#shop">SHOP NOW ↗</a>
</header>

<section class="hero">
  <p>NEW AGE. NEW FIT.</p>
  <h1>WEAR YOUR<br>OWN VIBE.</h1>
  <p>Streetwear made for your everyday mood.</p>
  <a href="#shop">EXPLORE COLLECTION</a>
</section>

<main id="shop">
  <h2 class="section-title">THE COLLECTION.</h2>
  <div class="products" id="products"></div>
</main>

<footer>
  <h2>RYVEO.</h2>
  <p>Find your fit. Own your vibe.</p>
  <p>Pan-India delivery · Orders via WhatsApp</p>
  <a href="https://instagram.com/" target="_blank">Instagram</a>
  <p>© 2026 Ryveo. All rights reserved.</p>
</footer>

<script>
// REPLACE THIS WITH YOUR WHATSAPP NUMBER.
// India example: 919876543210 (country code + number, no + sign)
const WHATSAPP_NUMBER = "917827271703";

const products = [
  {
    name: "Indigo baddie Streetwear Lookbook",
    price: 650,
    image: "Indigo Adddie Streetwear Lookbook.png",
    description: "Everyday oversized streetwear",
    colours: ["Denim"],
    sizes: ["S", "M", "L", "XL"]
  },
  {
    name: "might be drunk a little",
    price: 699,
    image: "5ea8b75a-c186-421b-93be-34007164f423.jpg",
    description: "Make a statement",
    colours: ["Black", "White"],
    sizes: ["S", "M", "L", "XL"]
  },
  {
    name: "vodkas are best",
    price: 699,
    image: "0aff0740-20ed-4c0f-a9c1-b2a85b6d619a.jpg",
    description: "Minimal fit, maximum vibe",
    colours: ["Black", "White", "Pink"],
    sizes: ["XS", "S", "M", "L"]
  }
];

const container = document.getElementById("products");

products.forEach((p, i) => {
  const card = document.createElement("article");
  card.className = "product";

  const image = document.createElement("img");
  image.src = p.image;
  image.alt = p.name;
  image.onerror = () => {
    image.alt = p.name + " — upload product photo";
  };

  const title = document.createElement("h3");
  title.textContent = p.name;

  const description = document.createElement("p");
  description.textContent = p.description;

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = "₹" + p.price;

  const colour = document.createElement("select");
  colour.setAttribute("aria-label", "Choose colour");
  p.colours.forEach(c => colour.add(new Option(c, c)));

  const size = document.createElement("select");
  size.setAttribute("aria-label", "Choose size");
  p.sizes.forEach(s => size.add(new Option(s, s)));

  const quantity = document.createElement("select");
  quantity.setAttribute("aria-label", "Choose quantity");
  for (let n = 1; n <= 5; n++) {
    quantity.add(new Option("Qty: " + n, String(n)));
  }

  const button = document.createElement("button");
  button.className = "order";
  button.textContent = "ORDER ON WHATSAPP";

  button.addEventListener("click", () => {
    if (!/^91\d{10}$/.test(WHATSAPP_NUMBER)) {
      alert("Please set your correct Indian WhatsApp number in the website code first.");
      return;
    }

    const qty = Number(quantity.value);
    const total = p.price * qty;

    const message = [
      "Hi Ryveo! I'd like to place an order.",
      "",
      "Product: " + p.name,
      "Price per item: Rs. " + p.price,
      "Quantity: " + qty,
      "Total product price: Rs. " + total,
      "Colour: " + colour.value,
      "Size: " + size.value,
      "",
      "Please confirm availability and delivery charges."
    ].join("\n");

    const url = "https://wa.me/" + WHATSAPP_NUMBER
      + "?text=" + encodeURIComponent(message);

    window.open(url, "_blank", "noopener,noreferrer");
  });

  card.append(image, title, description, price, colour, size,
              quantity, button);
  container.appendChild(card);
});
</script>
</body>
</html>
